<div
  class="ngx-tour-backdrop"
  [class.visible]="isVisible"
  (click)="onBackdropClick()"
>
  <svg class="backdrop-mask" width="100%" height="100%">
    <defs>
      <mask id="backdrop-mask">
        <rect width="100%" height="100%" fill="white"/>
        <rect
          [attr.x]="highlightStyle.left"
          [attr.y]="highlightStyle.top"
          [attr.width]="highlightStyle.width"
          [attr.height]="highlightStyle.height"
          [attr.rx]="8"
          fill="black"
        />
      </mask>
    </defs>
    <rect
      width="100%"
      height="100%"
      [attr.fill]="color"
      mask="url(#backdrop-mask)"
    />
  </svg>
</div>
